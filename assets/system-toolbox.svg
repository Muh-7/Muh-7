<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#7C3AED"/><stop offset=".48" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient>
</defs>

<style>
  .bg { fill:#070A0F; }
  .panel { fill:#0B1018; stroke:#202836; stroke-width:1.2; }
  .muted { fill:#7E8A9A; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .body { fill:#C8D2DE; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .white { fill:#F4F7FB; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .label { font-size:13px; letter-spacing:2px; font-weight:700; }
  .small { font-size:14px; }
</style>

<rect width="1200" height="300" rx="26" fill="#0A0F16" stroke="#202836"/>
<text x="38" y="46" class="muted label">SYSTEM TOOLBOX</text>
<text x="38" y="87" class="white" font-size="26" font-weight="800">Built around the full path, not one framework.</text>

<g transform="translate(38,124)">
  <text x="0" y="0" fill="#A78BFA" class="mono" font-size="11" font-weight="700">BUILD</text>
  <text x="0" y="30" class="body" font-size="16">Python  ·  TensorFlow  ·  scikit-learn  ·  OpenCV  ·  Ultralytics</text>

  <text x="390" y="0" fill="#22D3EE" class="mono" font-size="11" font-weight="700">SHIP</text>
  <text x="390" y="30" class="body" font-size="16">FastAPI  ·  Docker  ·  PostgreSQL  ·  Git  ·  Linux</text>

  <text x="790" y="0" fill="#34D399" class="mono" font-size="11" font-weight="700">OPERATE</text>
  <text x="790" y="30" class="body" font-size="16">GitHub Actions  ·  MLOps  ·  Versioning  ·  Monitoring</text>
</g>

<g transform="translate(38,216)">
  <line x1="28" y1="0" x2="1085" y2="0" stroke="url(#line)" stroke-width="2.5"/>
  <g class="mono" font-size="10">
    <circle cx="28" cy="0" r="7" fill="#7C3AED"/><text x="28" y="31" text-anchor="middle" fill="#AAB6C5">DATA</text>
    <circle cx="240" cy="0" r="7" fill="#8B5CF6"/><text x="240" y="31" text-anchor="middle" fill="#AAB6C5">MODEL</text>
    <circle cx="452" cy="0" r="7" fill="#22D3EE"/><text x="452" y="31" text-anchor="middle" fill="#AAB6C5">SERVICE</text>
    <circle cx="664" cy="0" r="7" fill="#38BDF8"/><text x="664" y="31" text-anchor="middle" fill="#AAB6C5">CONTAINER</text>
    <circle cx="876" cy="0" r="7" fill="#34D399"/><text x="876" y="31" text-anchor="middle" fill="#AAB6C5">CI/CD</text>
    <circle cx="1085" cy="0" r="7" fill="#10B981"><animate attributeName="r" values="6;10;6" dur="2.1s" repeatCount="indefinite"/></circle>
    <text x="1085" y="31" text-anchor="middle" fill="#AAB6C5">OBSERVE</text>
  </g>
</g>
</svg>