<svg xmlns="http://www.w3.org/2000/svg" width="580" height="275" viewBox="0 0 580 275">
<defs>
  <linearGradient id="a" x1="0" x2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <radialGradient id="gl"><stop stop-color="#A78BFA" stop-opacity=".25"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
</defs>

<style>
  .bg { fill:#070A0F; }
  .panel { fill:#0B1018; stroke:#202836; stroke-width:1.2; }
  .muted { fill:#7E8A9A; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .body { fill:#C8D2DE; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .white { fill:#F4F7FB; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .label { font-size:13px; letter-spacing:2px; font-weight:700; }
  .small { font-size:14px; }
</style>

<rect width="580" height="275" rx="24" fill="#0A0F16" stroke="#202836"/>
<circle cx="525" cy="36" r="130" fill="url(#gl)"/>
<text x="32" y="39" fill="#A78BFA" class="mono" font-size="12" font-weight="700">01 / BIO-AI</text>
<text x="548" y="39" text-anchor="end" class="muted mono" font-size="10">SEQUENCE → GENOMIC CONTEXT</text>
<text x="32" y="88" class="white" font-size="25" font-weight="800">DNA Mutation Analyzer</text>
<rect x="32" y="105" width="54" height="3" rx="2" fill="url(#a)"/>
<text x="32" y="142" class="body" font-size="15">SNV analysis across sequence, expression,</text><text x="32" y="166" class="body" font-size="15">splicing and transcription-factor effects.</text>
<text x="32" y="248" class="muted mono" font-size="10">GENCODE · GRCh38 · AlphaGenome · JASPAR · FIMO · Gradio</text>

<g transform="translate(436,125)">
  <path d="M0 0 C55 25 55 75 0 100 M70 0 C15 25 15 75 70 100" fill="none" stroke="#8B5CF6" stroke-width="3" opacity=".8"/>
  <g stroke="#22D3EE" opacity=".75">
    <line x1="14" y1="18" x2="56" y2="18"/><line x1="7" y1="42" x2="63" y2="42"/>
    <line x1="7" y1="66" x2="63" y2="66"/><line x1="14" y1="90" x2="56" y2="90"/>
  </g>
  <circle cx="35" cy="42" r="5" fill="#F472B6"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
</g>
</svg>