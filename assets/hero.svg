<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#070A0F"/>
    <stop offset=".55" stop-color="#0B1018"/>
    <stop offset="1" stop-color="#090D13"/>
  </linearGradient>
  <radialGradient id="g1">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".45"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2">
    <stop offset="0" stop-color="#22D3EE" stop-opacity=".32"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#1B2330" stroke-width=".7" opacity=".45"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<style>
  .bg { fill:#070A0F; }
  .panel { fill:#0B1018; stroke:#202836; stroke-width:1.2; }
  .muted { fill:#7E8A9A; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .body { fill:#C8D2DE; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .white { fill:#F4F7FB; font-family:Inter,Segoe UI,Arial,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .label { font-size:13px; letter-spacing:2px; font-weight:700; }
  .small { font-size:14px; }
</style>

<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<rect width="1200" height="430" rx="28" fill="url(#grid)" opacity=".6"/>
<circle cx="1035" cy="30" r="260" fill="url(#g1)"/>
<circle cx="850" cy="420" r="250" fill="url(#g2)"/>

<!-- brand rail -->
<rect x="42" y="40" width="156" height="30" rx="15" fill="#111722" stroke="#263142"/>
<circle cx="60" cy="55" r="5" fill="#A78BFA"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="75" y="60" class="white mono" font-size="12" letter-spacing="1.5">MUH-7 / ONLINE</text>

<text x="42" y="128" class="muted label">AI SYSTEMS / COMPUTER VISION / MLOPS</text>
<text x="42" y="190" class="white" font-size="48" font-weight="800" letter-spacing="-1.7">Models are only</text>
<text x="42" y="246" class="white" font-size="48" font-weight="800" letter-spacing="-1.7">the beginning.</text>
<text x="42" y="301" fill="#A78BFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">I build the rest.</text>
<text x="42" y="342" class="body" font-size="16">Data → models → inference → APIs → containers → reliable workflows</text>

<g transform="translate(42,376)">
  <rect width="152" height="30" rx="15" fill="#121823" stroke="#2A3444"/>
  <text x="76" y="20" text-anchor="middle" class="body mono" font-size="11">COMPUTER VISION</text>
  <rect x="164" width="145" height="30" rx="15" fill="#121823" stroke="#2A3444"/>
  <text x="236" y="20" text-anchor="middle" class="body mono" font-size="11">MACHINE LEARNING</text>
  <rect x="321" width="86" height="30" rx="15" fill="#121823" stroke="#2A3444"/>
  <text x="364" y="20" text-anchor="middle" class="body mono" font-size="11">MLOPS</text>
</g>

<!-- system map -->
<g transform="translate(785,68)">
  <circle cx="160" cy="140" r="112" fill="none" stroke="#273244" stroke-width="1.1"/>
  <circle cx="160" cy="140" r="72" fill="none" stroke="#202A39" stroke-width="1.1" stroke-dasharray="6 8">
    <animateTransform attributeName="transform" type="rotate" from="0 160 140" to="360 160 140" dur="22s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="140" r="22" fill="#111827" stroke="#A78BFA" stroke-width="2" filter="url(#glow)"/>
  <text x="160" y="145" text-anchor="middle" class="white mono" font-size="10">CORE</text>

  <path d="M160 118 L160 57 M181 132 L242 92 M181 150 L255 185 M139 150 L75 187 M139 132 L70 88"
        fill="none" stroke="#334155" stroke-width="1.4"/>

  <g>
    <circle cx="160" cy="48" r="12" fill="#7C3AED"/>
    <text x="160" y="22" text-anchor="middle" class="white mono" font-size="10">VISION</text>
  </g>
  <g>
    <circle cx="252" cy="85" r="12" fill="#22D3EE"/>
    <text x="273" y="82" class="white mono" font-size="10">BIO-AI</text>
  </g>
  <g>
    <circle cx="264" cy="191" r="12" fill="#F59E0B"/>
    <text x="286" y="194" class="white mono" font-size="10">MLOPS</text>
  </g>
  <g>
    <circle cx="65" cy="194" r="12" fill="#34D399"/>
    <text x="2" y="198" class="white mono" font-size="10">ML CORE</text>
  </g>
  <g>
    <circle cx="58" cy="83" r="12" fill="#FB7185"/>
    <text x="4" y="62" class="white mono" font-size="10">OCR</text>
  </g>

  <circle cx="160" cy="28" r="3.5" fill="#fff">
    <animateTransform attributeName="transform" type="rotate" from="0 160 140" to="360 160 140" dur="7s" repeatCount="indefinite"/>
  </circle>
</g>

<text x="1128" y="397" text-anchor="end" class="muted mono" font-size="10">BUILD / TEST / SHIP / OBSERVE</text>
</svg>