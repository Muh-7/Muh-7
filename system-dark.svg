<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255">
<style>.ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="1200" height="255" rx="26" fill="#0C1118" stroke="#222B37"/>
<text x="38" y="43" class="mono" fill="#7D8998" font-size="10" letter-spacing="1.7">ENGINEERING SYSTEM</text>
<text x="38" y="83" class="ui" fill="#F4F7FB" font-size="26" font-weight="800">From model quality to system reliability.</text>
<text x="38" y="113" class="ui" fill="#C1CAD6" font-size="14">Current direction: reproducible ML workflows, deployment, CI/CD, monitoring and model lifecycle.</text>
<g transform="translate(38,169)">
  <path d="M0 0 H1095" stroke="#222B37" stroke-width="2"/>
  <g class="mono" font-size="9">
    <circle cx="0" cy="0" r="6" fill="#6EE7F9"/><text x="0" y="30" text-anchor="middle" fill="#7D8998">DATA</text>
    <circle cx="219" cy="0" r="6" fill="#6EE7F9"/><text x="219" y="30" text-anchor="middle" fill="#7D8998">TRAIN</text>
    <circle cx="438" cy="0" r="6" fill="#8B7CFF"/><text x="438" y="30" text-anchor="middle" fill="#7D8998">PACKAGE</text>
    <circle cx="657" cy="0" r="6" fill="#8B7CFF"/><text x="657" y="30" text-anchor="middle" fill="#7D8998">DEPLOY</text>
    <circle cx="876" cy="0" r="6" fill="#70E1A1"/><text x="876" y="30" text-anchor="middle" fill="#7D8998">MONITOR</text>
    <circle cx="1095" cy="0" r="6" fill="#70E1A1"><animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/></circle><text x="1095" y="30" text-anchor="middle" fill="#7D8998">IMPROVE</text>
  </g>
  <circle r="4.5" fill="#6EE7F9"><animateMotion dur="5.8s" repeatCount="indefinite" path="M0 0 H1095"/></circle>
</g>
<g transform="translate(835,35)" class="mono" font-size="10">
  <rect x="0" y="0" width="116" height="28" rx="14" fill="#080B10" stroke="#222B37"/><text x="58" y="18" text-anchor="middle" fill="#7D8998">PYTHON</text>
  <rect x="126" y="0" width="116" height="28" rx="14" fill="#080B10" stroke="#222B37"/><text x="184" y="18" text-anchor="middle" fill="#7D8998">TENSORFLOW</text>
  <rect x="252" y="0" width="78" height="28" rx="14" fill="#080B10" stroke="#222B37"/><text x="291" y="18" text-anchor="middle" fill="#7D8998">DOCKER</text>
